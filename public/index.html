function syncInputs(){boxes.forEach(b=>{b.input.value=state.q;b.clear.hidden=!state.q})}
const cache=new Map();
async function runSearch(q,tab){state.q=q;state.tab=tab;setMode('results');syncInputs();updateTitle();$$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));addHistory(q);
 const my=++seq;if(controller)controller.abort();controller=new AbortController();showLoading();
 const key=JSON.stringify([q,tab,state.settings]);
 try{let out=cache.get(key);
  if(!out){const t0=performance.now();const data=await tavilySearch(q,tab,controller.signal);const videos=tab==='videos'?await searchVideos(q):[];out={data,videos,ms:performance.now()-t0};cache.set(key,out)}
  if(my!==seq)return;state.lastRender=()=>renderResults(out.data,out.videos,q,tab,out.ms);state.lastRender();
 }catch(e){if(e.name==='AbortError'||my!==seq)return;console.error(e);state.lastRender=()=>renderError(e);state.lastRender()}
 window.scrollTo({top:0})}
function showLoading(){const box=$('#results');box.replaceChildren();state.lastRender=null;
 if(state.tab==='images'){const g=el('div',{class:'grid'});for(let i=0;i<16;i++)g.append(el('div',{class:'sk',style:'height:'+([180,130,220,150,200,140,170,210][i%8])+'px;margin-bottom:12px'}));box.append(g);return}
 if(state.tab==='videos'){const g=el('div',{class:'videos-grid'});for(let i=0;i<8;i++)g.append(el('div',{class:'video-card'},el('div',{class:'sk',style:'aspect-ratio:16/9'}),el('div',{style:'padding:14px'},el('div',{class:'sk',style:'height:16px;margin-bottom:8px'}),el('div',{class:'sk',style:'width:60%;height:12px'}))));box.append(g);return}
 if(state.tab==='maps')box.append(el('div',{class:'sk',style:'height:300px;margin-bottom:12px'}));
 for(let i=0;i<5;i++)box.append(el('div',{class:'sk-res'},el('div',{class:'sk',style:'width:28%'}),el('div',{class:'sk',style:'width:62%;height:18px'}),el('div',{class:'sk',style:'width:96%'}),el('div',{class:'sk',style:'width:80%'})))}
function highlight(text,q){const w=q.split(/\s+/).filter(x=>x.length>2).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));const f=document.createDocumentFragment();if(!w.length){f.append(text);return f}let re;try{re=new RegExp('('+w.join('|')+')','giu')}catch{f.append(text);return f}text.split(re).forEach((p,i)=>{if(p)f.append(i%2?el('b',{text:p}):p)});return f}
function clip(s,n){s=(s||'').replace(/\s+/g,' ').trim();return s.length<=n?s:s.slice(0,n)+'…'}
function fmtDate(d){try{const x=new Date(d);return isNaN(x)?'':x.toLocaleDateString(state.lang==='kk'?'kk-KZ':'ru-RU',{day:'numeric',month:'long',year:'numeric'})}catch{return''}}
function resultItem(r,q,tab){const href=safeUrl(r.url);const u=new URL(href);const host=u.hostname.replace(/^www\./,'');
 const fav=el('img',{src:'https://www.google.com/s2/favicons?domain='+encodeURIComponent(u.hostname)+'&sz=64',alt:'',loading:'lazy'});fav.addEventListener('error',()=>fav.style.visibility='hidden');
 const sn=el('p',{class:'res-snippet'});if(tab==='news'&&r.published_date){const d=fmtDate(r.published_date);if(d)sn.append(el('span',{class:'res-date',text:d+' —'}))}sn.append(highlight(clip(r.content,300),q));
 return el('article',{class:'res'},el('div',{class:'res-site'},fav,el('span',{class:'dom',text:host})),el('a',{class:'res-title',href,target:'_blank',rel:'noopener noreferrer',text:r.title||host}),sn)}
function aiCard(a){return el('div',{class:'ai'},el('div',{class:'ai-head'},iconEl('spark'),el('span',{text:t('aiTitle')})),el('p',{text:a}),el('small',{text:t('aiNote')}))}
function stateBox(i,ti,tx,err){return el('div',{class:'state'+(err?' err':'')},iconEl(i),el('h3',{text:ti}),el('p',{text:tx}))}
const imgObs=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){const img=en.target;if(img.dataset.src){img.src=img.dataset.src;img.onload=()=>{img.classList.add('loaded');const b=img.previousElementSibling;if(b?.classList.contains('blur-preview'))b.classList.add('hidden')}}imgObs.unobserve(img)}}),{rootMargin:'250px'});
function imgFigure(i,idx,q){const fig=el('figure');const blur=el('div',{class:'blur-preview',style:`background-image:url(${i.url})`});const img=el('img',{alt:i.description||q,'data-src':i.url,loading:idx<8?'eager':'lazy',decoding:'async'});fig.append(blur,img);img.addEventListener('click',()=>openLightbox(i));imgObs.observe(img);return fig}
function videoCard(v){const dur=v.duration?`${Math.floor(v.duration/60)}:${String(v.duration%60).padStart(2,'0')}`:'';
 return el('a',{class:'video-card',href:v.url,target:'_blank',rel:'noopener noreferrer'},
  el('div',{class:'video-thumb'},el('img',{src:v.thumbnail_720_url||v.thumbnail_360_url,alt:'',loading:'lazy'}),el('div',{class:'video-play'}),dur?el('div',{class:'video-duration',text:dur}):null),
  el('div',{class:'video-info'},el('div',{class:'video-title',text:v.title}),el('div',{class:'video-meta'},el('span',{class:'video-channel',text:v.channel||''}))))}
function renderResults(data,videos,q,tab,ms){const box=$('#results');box.replaceChildren();
 if(tab==='all')findAds(q).forEach(a=>box.append(renderAdCard(a)));
 if(tab==='maps'){Jol.renderMapWidget(box,q);const l=(data.results||[]).filter(r=>safeUrl(r.url));if(l.length){box.append(el('p',{class:'meta',text:t('resCount',{n:l.length})}));l.forEach(r=>box.append(resultItem(r,q,tab)))}return}
 if(tab==='all'&&Jol.isGeoQuery(q))Jol.renderMapWidget(box,q);
 if(tab==='videos'){box.append(el('p',{class:'meta',text:t('videoCount',{n:videos.length})+' · '+(ms/1000).toFixed(2)+' '+t('sec')}));if(!videos.length)return void box.append(stateBox('empty',t('noResTitle'),t('noResText')));const g=el('div',{class:'videos-grid'});videos.forEach(v=>g.append(videoCard(v)));box.append(g);return}
 if(tab==='images'){const imgs=(data.images||[]).filter(i=>safeUrl(i.url));box.append(el('p',{class:'meta',text:t('imgCount',{n:imgs.length})+' · '+(ms/1000).toFixed(2)+' '+t('sec')}));if(!imgs.length)return void box.append(stateBox('empty',t('noResTitle'),t('noResText')));const g=el('div',{class:'grid'});imgs.forEach((i,x)=>g.append(imgFigure(i,x,q)));box.append(g);return}
 const l=(data.results||[]).filter(r=>safeUrl(r.url));if(!l.length&&!data.answer)return void box.append(stateBox('empty',t('noResTitle'),t('noResText')));
 box.append(el('p',{class:'meta',text:t('resCount',{n:l.length})+' · '+(ms/1000).toFixed(2)+' '+t('sec')}));if(data.answer)box.append(aiCard(data.answer));l.forEach(r=>box.append(resultItem(r,q,tab)))}
function renderError(e){const box=$('#results');box.replaceChildren(stateBox('alert',t('errTitle'),e.status?t('errGeneric'):t('errNetwork'),true))}
let settingsDirty=false;
function openModal(id){closeMenus();$$('.overlay.open').forEach(m=>m.classList.remove('open'));$('#'+id).classList.add('open')}
function closeModal(){$('.overlay.open')?.classList.remove('open');if(settingsDirty){settingsDirty=false;if(!isHome())applyRoute()}}
function closeMenus(){$('#userMenu').hidden=true}
function openLightbox(i){const u=safeUrl(i.url);if(!u)return;$('#lbImg').src=u;$('#lbCap').textContent=i.description||'';$('#lbCap').hidden=!i.description;$('#lbOpen').href=u;openModal('lightbox')}
function initSettings(){const s=state.settings;$('#setCount').value=String(s.count);$('#setKz').checked=!!s.kz;$('#setAi').checked=!!s.ai;$('#setHist').checked=!!s.saveHistory;
 const b=(id,k,c)=>$('#'+id).addEventListener('change',e=>{s[k]=c(e.target);store.set('settings',s);settingsDirty=true});
 b('setCount','count',n=>+n.value);b('setKz','kz',n=>n.checked);b('setAi','ai',n=>n.checked);b('setHist','saveHistory',n=>n.checked);
 $('#clearHist').addEventListener('click',()=>{store.del('history');toast(t('histCleared'))})}
let authMode='login';
function renderUser(){const u=state.user;$('#loginBtn').hidden=!!u;$('#userWrap').hidden=!u;if(!u)return;const b=$('#userBtn');b.replaceChildren();const p=u.picture&&safeUrl(u.picture);if(p)b.append(el('img',{src:p,alt:''}));else b.textContent=(u.name||'?').charAt(0).toUpperCase();$('#umName').textContent=u.name||'';$('#umEmail').textContent=u.email||''}
function setSession(u){state.user=u;if(u)store.set('session',u);else store.del('session');renderUser()}
function authMsg(k){const m=$('#authMsg');if(k){m.textContent=t(k)}else m.textContent=''}
function setAuthMode(m){authMode=m;$$('#authTabs button').forEach(b=>b.classList.toggle('on',b.dataset.auth===m));$('#nameField').hidden=m!=='register';$('#authSubmit').textContent=t(m==='login'?'submitLogin':'submitRegister');authMsg('')}
async function hashPw(pw,salt){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{return'x'}}
async function submitAuth(e){e.preventDefault();const email=$('#aEmail').value.trim().toLowerCase(),pass=$('#aPass').value,name=$('#aName').value.trim();
 if(!/^\S+@\S+\.\S+$/.test(email))return authMsg('badEmail');if(pass.length<6)return authMsg('shortPass');
 const users=store.get('users',{});
 if(authMode==='register'){if(users[email])return authMsg('emailTaken');const salt=Math.random().toString(36).slice(2);users[email]={name:name||email.split('@')[0],salt,hash:await hashPw(pass,salt)};store.set('users',users)}
 else{const u=users[email];if(!u||u.hash!==await hashPw(pass,u.salt))return authMsg('badCreds')}
 setSession({name:users[email].name,email,provider:'email'});$('#authForm').reset();authMsg('');closeModal();toast(t('welcome',{name:users[email].name}))}
let gis=null;
async function googleLogin(){if(!CONFIG.GOOGLE_CLIENT_ID)return authMsg('googleNotSet');if(!window.google?.accounts?.oauth2)return authMsg('googleFail');
 try{if(!gis)gis=google.accounts.oauth2.initTokenClient({client_id:CONFIG.GOOGLE_CLIENT_ID,scope:'openid email profile',callback:async r=>{if(!r||r.error)return authMsg('googleFail');try{const x=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+r.access_token}});const u=await x.json();setSession({name:u.name||u.email,email:u.email,picture:u.picture||'',provider:'google'});authMsg('');closeModal();toast(t('welcome',{name:u.name||u.email}))}catch{authMsg('googleFail')}},error_callback:()=>authMsg('googleFail')});gis.requestAccessToken()}catch{authMsg('googleFail')}}
function initQuickAccess(){const L=[['Kaspi','kaspi.kz'],['eGov','egov.kz'],['Kolesa','kolesa.kz'],['OLX','olx.kz'],['Halyk','halykbank.kz'],['Krisha','krisha.kz'],['Sulpak','sulpak.kz'],['Technodom','technodom.kz']];
 const c=$('#quickAccess');c.replaceChildren();L.forEach(([n,d])=>c.append(el('a',{class:'quick-item',href:'https://'+d,target:'_blank',rel:'noopener noreferrer'},el('img',{src:`https://www.google.com/s2/favicons?domain=${d}&sz=128`,alt:n,loading:'lazy'}),el('span',{text:n}))))}
async function loadNewsFeed(){if(!isHome())return;const c=$('#newsFeed'),it=$('#newsItems');c.hidden=false;it.replaceChildren();
 try{const d=await tavilySearch('top news today','news');const n=(d.results||[]).slice(0,6).filter(r=>safeUrl(r.url));if(!n.length){c.hidden=true;return}
  n.forEach((x,i)=>{const u=new URL(safeUrl(x.url));const a=el('a',{class:'news-item',href:safeUrl(x.url),target:'_blank',style:'animation-delay:'+(i*.1)+'s'},el('div',{class:'news-item-content'},el('div',{class:'news-item-title',text:x.title||''}),el('div',{class:'news-item-meta'},el('span',{class:'news-item-site',text:u.hostname.replace(/^www\./,'')}))));it.append(a)})}
 catch{c.hidden=true}}
function init(){fillIcons();setupSearchBox($('#hdrBox'));setupSearchBox($('#homeBox'));fillIcons();initSettings();setTheme(state.theme);initQuickAccess();loadNewsFeed();
 $$('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
 $$('[data-theme-set]').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.themeSet)));
 $('#themeBtn').addEventListener('click',()=>setTheme(state.theme==='dark'?'light':'dark'));
 $('#chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(c){const q=t(c.dataset.q);navigate(q,Jol.isGeoQuery(q)?'maps':'all')}});
 $('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;if(b.dataset.tab==='maps'&&!state.q)Jol.open();else if(state.q)navigate(state.q,b.dataset.tab)});
 $('#brandLink').addEventListener('click',e=>{e.preventDefault();navigate('','all')});
 $('#settingsBtn').addEventListener('click',()=>openModal('settingsModal'));
 $('#loginBtn').addEventListener('click',()=>{setAuthMode('login');openModal('authModal')});
 $$('.overlay').forEach(o=>o.addEventListener('mousedown',e=>{if(e.target===o)closeModal()}));
 $$('[data-close]').forEach(b=>b.addEventListener('click',closeModal));
 $('#userBtn').addEventListener('click',e=>{e.stopPropagation();$('#userMenu').hidden=!$('#userMenu').hidden});
 $('#umSettings').addEventListener('click',()=>openModal('settingsModal'));
 $('#umLogout').addEventListener('click',()=>{closeMenus();setSession(null);toast(t('bye'))});
 document.addEventListener('click',e=>{if(!e.target.closest('#userWrap'))closeMenus()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#jol').hidden)Jol.close();else{closeModal();closeMenus()}}});
 $('#authTabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setAuthMode(b.dataset.auth)});
 $('#authForm').addEventListener('submit',submitAuth);
 $('#googleBtn').addEventListener('click',googleLogin);
 window.addEventListener('hashchange',applyRoute);
 applyI18n();applyRoute()}
init();
})();
</script>
